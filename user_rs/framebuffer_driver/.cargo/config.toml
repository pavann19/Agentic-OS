[build]
target = "x86_64-unknown-none"

# Hardened defensively: this target's prebuilt compiler_builtins lacks
# the memset/memcpy/memmove/memcmp intrinsics by default, which
# user_rs/virtio_blk_driver's real ext2 code (large [0u8; N] zero-inits)
# actually hit -- a call through an unpopulated, always-zero symbol. This
# crate hasn't hit it yet, added here before it does.
[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "link-arg=--no-dynamic-linker",
]
