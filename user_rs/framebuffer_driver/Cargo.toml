[package]
name = "framebuffer_driver"
version = "0.1.0"
edition = "2021"

# Second real user-space driver (Phase 3): a genuine freestanding ELF64
# binary, built completely separately from kernel_rs, loaded at runtime
# by kernel_rs/src/elf.rs -- same pattern as user_rs/serial_driver.
[dependencies]
# See user_rs/serial_driver/Cargo.toml's comment / kernel_common/src/
# mem_intrinsics.rs's doc for the real bug this prevents.
kernel_common = { path = "../../kernel_common", features = ["provide_mem_intrinsics"] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
