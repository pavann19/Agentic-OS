[package]
name = "netstack_driver"
version = "0.1.0"
edition = "2021"

# Phase 10 (`docs/ROADMAP.md` Sec5): the real, user-space network-stack
# process (ADR-001 -- protocol logic lives in ring 3, never the kernel).
# Owns the same real Intel e1000-class NIC `e1000_driver` already
# brought up (same PCI device, same real MAC-from-hardware discipline)
# and builds Ethernet RX/ARP/IPv4/ICMP/UDP/TCP/DNS from spec on top of
# it -- not a port of any existing TCP/IP stack, real state machines
# implemented from the actual RFCs.
[dependencies]
kernel_common = { path = "../../kernel_common", features = ["provide_mem_intrinsics"] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
