[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# Same relocation-model=static reasoning as kernel_rs/boot_rs: the loader
# (kernel_rs/src/elf.rs) does not process relocation entries, only
# PT_LOAD segments -- a self-relocating (PIE) binary would be silently
# wrong under that loader.
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "link-arg=--no-dynamic-linker",
]
