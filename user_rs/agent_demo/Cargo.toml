[package]
name = "agent_demo"
version = "0.1.0"
edition = "2021"

# Phase 5's agent process model (`docs/ROADMAP.md` §5 Phase 5,
# deliverable 1): a genuine freestanding ELF64 binary, built completely
# separately from kernel_rs, loaded at runtime by kernel_rs/src/elf.rs --
# same pattern as every other user_rs/* driver crate. Unlike a driver,
# this process holds no hardware capability at all -- its only possible
# capability is Rights::INTROSPECT over a Phase 5 IntrospectionHandle.
# kernel_rs/src/agent.rs spawns this SAME compiled binary twice: once
# with that capability granted, once without -- the difference in
# outcome is entirely the kernel's own capability check, not anything
# this code decides for itself.
[dependencies]
kernel_common = { path = "../../kernel_common", features = ["provide_mem_intrinsics"] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
