[package]
name = "nvme_driver"
version = "0.1.0"
edition = "2021"

# Phase 8's other storage half of "Tier 2 machine fully supported" --
# a real NVMe driver, spec-based, targeting QEMU's own nvme device
# emulation. This is docs/TIER2_HARDWARE.md's own researched answer for
# the recommended T480's PRIMARY storage (NVMe M.2) -- unlike the AHCI
# driver, which covers a secondary/legacy SATA path, this is the
# protocol the boot drive itself actually needs. Same freestanding-ELF64
# pattern as every other user_rs/* driver crate.
[dependencies]
kernel_common = { path = "../../kernel_common", features = ["provide_mem_intrinsics"] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
