name: build-and-boot

# Core defended scope only (see docs/VERIFICATION.md for the full
# rationale): capability table + generation-based revocation, the
# syscall/IPC boundary that enforces it, paging/address-space
# isolation, UEFI boot -> kernel handoff, and one supervised
# user-space driver. Everything else in this repo is real code with
# its own local test script, but is NOT asserted here -- it stays
# Partial/Experimental in docs/VERIFICATION.md until its own test is
# wired into this file, rather than implying broader coverage than
# this workflow actually checks.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact nightly + targets +
      # components; `rustup show` alone is enough to make the
      # preinstalled rustup on this runner install and switch to
      # exactly that, no third-party action needed for this part.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            boot_rs
            kernel_rs
            kernel_common
            host_tests
            user_rs/serial_driver
            user_rs/framebuffer_driver
            user_rs/keyboard_driver
            user_rs/virtio_blk_driver

      - name: Install QEMU and OVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Build bootloader, userland drivers, and kernel (make image)
        run: make image

      - name: Run host_tests (pure-logic unit tests, no QEMU)
        run: cargo test --manifest-path host_tests/Cargo.toml

      - name: Boot check (BOOT_START -> EXIT_BOOT_SERVICES_OK -> KERNEL_ENTER)
        run: scripts/ci/boot-test.sh boot

      - name: Capability revocation check (same boot, also asserts REVOCATION_REJECTED_OK)
        run: scripts/ci/boot-test.sh revoke

      - name: Upload serial logs as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs
          path: _evidence/latest/serial-ci-*.log
          if-no-files-found: warn

  fuzz-ext2-parsers:
    # Bounded smoke-fuzz, not a continuous fuzzing service: each target
    # gets a short, fixed time budget so a real crash/panic/assert
    # failure fails this job fast, without pretending to be exhaustive
    # coverage. See fuzz/Cargo.toml's own doc comment for why these
    # three targets (kernel_common::ext2's on-disk parsers) were chosen
    # first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz each ext2 parser target for 60 seconds
        # cargo-fuzz's own project-detection walks up from CWD looking
        # for a Cargo.toml that isn't itself inside fuzz/ -- this repo
        # is a set of independent crates with no root/workspace
        # Cargo.toml, so `cargo fuzz` must run from inside fuzz/ itself
        # (confirmed against a real CI failure: "could not find a cargo
        # project" when run from the repo root).
        working-directory: fuzz
        run: |
          for target in ext2_dir_parsing ext2_resolve_path ext2_read_file_data; do
            echo "=== fuzzing $target ==="
            cargo fuzz run "$target" -- -max_total_time=60
          done
