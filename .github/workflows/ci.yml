name: build-and-boot

# Core defended scope only (see docs/VERIFICATION.md for the full
# rationale): capability table + generation-based revocation, the
# syscall/IPC boundary that enforces it, paging/address-space
# isolation, UEFI boot -> kernel handoff, and one supervised
# user-space driver. Everything else in this repo is real code with
# its own local test script, but is NOT asserted here -- it stays
# Partial/Experimental in docs/VERIFICATION.md until its own test is
# wired into this file, rather than implying broader coverage than
# this workflow actually checks.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact nightly + targets +
      # components; `rustup show` alone is enough to make the
      # preinstalled rustup on this runner install and switch to
      # exactly that, no third-party action needed for this part.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            boot_rs
            kernel_rs
            kernel_common
            host_tests
            user_rs/serial_driver
            user_rs/framebuffer_driver
            user_rs/keyboard_driver
            user_rs/virtio_blk_driver

      - name: Install QEMU and OVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Locate the real OVMF_CODE path installed by this runner's ovmf package
        # The ovmf apt package's file name/location has genuinely moved
        # across Ubuntu releases (confirmed against a real CI failure:
        # /usr/share/OVMF/OVMF_CODE.fd did not exist on this runner) --
        # found at run time instead of hardcoding a path that drifts
        # out from under this workflow the next time the runner image
        # updates.
        run: |
          # A loose `find ... | head -n1` previously picked
          # OVMF_CODE_4M.snakeoil.fd (a self-signed/secure-boot test
          # variant this runner also ships) ahead of the plain variant
          # -- confirmed as the real cause of a genuine firmware-level
          # crash (#UD invalid-opcode fault inside EDK2 itself, "Can't
          # find image information", not a kernel bug) on a real CI
          # run. Search a priority list of the standard, non-secure-boot
          # filenames first, explicitly skipping anything with
          # "snakeoil" or "ms" (Microsoft-signed) in the name.
          OVMF_PATH=""
          for candidate in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            found=$(find /usr/share -iname "$candidate" 2>/dev/null | head -n1)
            if [ -n "$found" ]; then OVMF_PATH="$found"; break; fi
          done
          if [ -z "$OVMF_PATH" ]; then
            OVMF_PATH=$(find /usr/share -iname 'OVMF_CODE*.fd' ! -iname '*snakeoil*' ! -iname '*.ms.fd' 2>/dev/null | head -n1)
          fi
          if [ -z "$OVMF_PATH" ]; then
            echo "::error::No usable OVMF_CODE*.fd found under /usr/share after installing ovmf"
            find /usr/share -iname '*ovmf*' -o -iname '*OVMF*' 2>/dev/null
            exit 1
          fi
          echo "Found OVMF firmware at $OVMF_PATH"
          echo "AGENTIC_OS_OVMF_CODE=$OVMF_PATH" >> "$GITHUB_ENV"

      - name: Build bootloader, userland drivers, and kernel (make image)
        run: make image

      - name: Run host_tests (pure-logic unit tests, no QEMU)
        run: cargo test --manifest-path host_tests/Cargo.toml

      - name: Boot check (BOOT_START -> EXIT_BOOT_SERVICES_OK -> KERNEL_ENTER)
        run: scripts/ci/boot-test.sh boot

      - name: Capability revocation check (same boot, also asserts REVOCATION_REJECTED_OK)
        run: scripts/ci/boot-test.sh revoke

      - name: Upload serial logs as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs
          path: _evidence/latest/serial-ci-*.log
          if-no-files-found: warn

      - name: Upload kernel.elf for offline crash-address symbol resolution
        # Debugging aid for a real, currently-open finding: a page
        # fault during the revoke boot run, at an address that only
        # means something against the EXACT binary that crashed --
        # cross-host builds (this runner's Linux-GNU host vs. a
        # Windows-GNU dev host) are not guaranteed to lay out code
        # identically even from the same source, so a locally-built
        # kernel.elf's symbol table cannot be trusted to resolve a
        # CI crash address precisely. Uploaded unconditionally
        # (always), not just on failure, since the current failure
        # doesn't visibly corrupt the artifact from a successful step.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-elf
          path: kernel_rs/target/x86_64-unknown-none/release/agentic_kernel
          if-no-files-found: warn

  fuzz-ext2-parsers:
    # Bounded smoke-fuzz, not a continuous fuzzing service: each target
    # gets a short, fixed time budget so a real crash/panic/assert
    # failure fails this job fast, without pretending to be exhaustive
    # coverage. See kernel_common/fuzz/Cargo.toml's own doc comment for
    # why these three targets (kernel_common::ext2's on-disk parsers)
    # were chosen first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz each ext2 parser target for 60 seconds
        # cargo-fuzz's project-detection walks up from CWD looking for
        # a Cargo.toml paired with a fuzz/ subdirectory -- it must run
        # from the CRATE fuzz/ lives under (kernel_common/), the
        # standard cargo-fuzz layout, not from fuzz/ itself and not
        # from the repo root (confirmed against two real CI failures:
        # "could not find a cargo project" from both of those).
        working-directory: kernel_common
        run: |
          for target in ext2_dir_parsing ext2_resolve_path ext2_read_file_data; do
            echo "=== fuzzing $target ==="
            cargo fuzz run "$target" -- -max_total_time=60
          done
