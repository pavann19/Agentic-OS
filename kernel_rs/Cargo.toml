[package]
name = "agentic_kernel"
version = "0.1.0"
edition = "2021"

# Built as a `bin` crate (src/main.rs) so `cargo build` links kernel.elf
# directly via rust-lld, per the custom target's linker-flavor. No external
# `ld` involved — this machine's system `ld` only targets PE (i386pep), not
# ELF, so that's not a style choice, it's the only thing that works here.
#
# No external crates. Phase 0 keeps the dependency graph empty so `cargo build`
# never needs network access to iterate — only `core` and `compiler_builtins`,
# built from source via -Zbuild-std (see .cargo/config.toml).
[dependencies]
kernel_common = { path = "../kernel_common" }

# Fault-injection test hooks (docs/ROADMAP.md Phase 0 item: `make
# test-faults`). Mutually exclusive, all off by default -- a normal build
# never triggers any of these. See main.rs's fault_injection module and
# scripts/test-faults.ps1.
[features]
fault_test_null_deref = []
fault_test_rodata_write = []
fault_test_nx_exec = []
fault_test_double_fault = []
# Ring 3 proof-of-concept (docs/ROADMAP.md Phase 1 item). Deliberately
# faults (see ring3.rs's module doc) -- off by default so a normal boot
# reaches its steady-state loop instead of an intentional #GP. Verified via
# scripts/test-ring3.ps1.
demo_ring3 = []

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
