[package]
name = "agentic_kernel"
version = "0.1.0"
edition = "2021"

# Built as a `bin` crate (src/main.rs) so `cargo build` links kernel.elf
# directly via rust-lld, per the custom target's linker-flavor. No external
# `ld` involved — this machine's system `ld` only targets PE (i386pep), not
# ELF, so that's not a style choice, it's the only thing that works here.
#
# No external crates. Phase 0 keeps the dependency graph empty so `cargo build`
# never needs network access to iterate — only `core` and `compiler_builtins`,
# built from source via -Zbuild-std (see .cargo/config.toml).
[dependencies]
kernel_common = { path = "../kernel_common", features = ["provide_mem_intrinsics"] }

# Fault-injection test hooks (docs/ROADMAP.md Phase 0 item: `make
# test-faults`). Mutually exclusive, all off by default -- a normal build
# never triggers any of these. See main.rs's fault_injection module and
# scripts/test-faults.ps1.
[features]
fault_test_null_deref = []
fault_test_rodata_write = []
fault_test_nx_exec = []
fault_test_double_fault = []
# Ring 3 proof-of-concept (docs/ROADMAP.md Phase 1 item). Deliberately
# faults (see ring3.rs's module doc) -- off by default so a normal boot
# reaches its steady-state loop instead of an intentional #GP. Verified via
# scripts/test-ring3.ps1.
demo_ring3 = []
# Research track (docs/RESEARCH_TRACK.md): the authority-graph hardware
# self-check and live-device revocation-fault demo. Off by default --
# found, by real test-suite failure, to add real synchronous wall-clock
# delay to every boot (a deliberate bounded wait for an
# expected-to-fail command), which broke test-keyboard.ps1's fixed
# boot-wait timing. Same discipline as fault_test_*/demo_ring3 above:
# a normal boot never runs this. See scripts/test-authority-revoke.ps1.
research_authority_hw_demo = []
# Phase 6's real induced-failure trial (docs/ROADMAP.md Phase 6 exit
# criteria). Off by default -- a normal build embeds the correct
# virtio-net driver. See virtio_net.rs's module doc and
# scripts/test-synthesis-fault-demo.ps1.
synthesis_induced_fault = []
# Phase 10 (docs/ROADMAP.md Sec5): the real network-stack process
# (netstack.rs/user_rs/netstack_driver) owns the e1000-class NIC
# instead of e1000.rs's own Phase 8 demo -- the two are mutually
# exclusive (both would race for the same device's BAR/DMA). Off by
# default so the default boot's existing, already-evidenced Phase 8
# e1000 demo is unaffected; see scripts/test-network.ps1.
network_stack = []
# Phase 10 exit criterion 3: real, adversarial proof that revoking a
# `Socket` capability mid-use makes it unusable immediately. Off by
# default -- same discipline as every other demo feature above; see
# socket_demo.rs's own module doc and scripts/test-socket-revoke.ps1.
socket_revoke_demo = []
# Phase 12 deliverable 1: the minimal real compositor foundation
# (compositor.rs/user_rs/compositor_driver) REPLACES the default
# Phase 3 framebuffer_driver demo when on -- both would otherwise race
# for the same real framebuffer's contents. Off by default; see
# compositor.rs's own module doc and scripts/test-compositor.ps1.
compositor_demo = []
# Phase 13 deliverable 1's own exit criterion: real, adversarial proof
# that an app is granted exactly its manifest's declared capabilities,
# nothing ambient -- a grant for an undeclared capability kind is
# refused. Off by default -- same discipline as every other demo
# feature above; see manifest_demo.rs's own module doc and
# scripts/test-manifest.ps1.
manifest_demo = []

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
