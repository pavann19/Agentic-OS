[build]
target = "x86_64-unknown-uefi"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-uefi]
# rustc's built-in x86_64-unknown-uefi target already sets subsystem
# EFI_APPLICATION; /entry is pinned explicitly rather than relying on
# lld-link's default entry-symbol guess, so a rename of efi_main would fail
# to link instead of silently producing an unbootable image.
rustflags = ["-C", "link-args=/entry:efi_main /Brepro /DEBUG:NONE"]
